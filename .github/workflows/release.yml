name: Release

# 触发方式：
#   1. 推送 v* 标签（例如 v0.0.1）→ 构建三平台产物并发布 GitHub Release
#   2. 手动触发（仅构建，产物上传为 workflow artifact，不发布）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: --win
          - os: macos-latest
            script: --mac
          - os: ubuntu-latest
            script: --linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build renderer + main
        run: npm run build

      - name: Package & publish
        # 只有打 tag 时才带 --publish always，手动触发只出产物不发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder ${{ matrix.script }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}

      - name: Upload artifacts (manual run only)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: transius-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: ignore

  # ⚠️ electron-builder 在多平台并行构建时会各自建一个 **draft** release，
  #    即使传了 --publish always 也不会自动转为正式版。
  #    若不补这一步，产物的下载链接会是 untagged-<hash> 这种临时地址。
  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Un-draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # 三个平台可能各建了一个 draft，逐个发布；已正式化的会返回错误，忽略即可
          gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName,isDraft \
            --jq '.[] | select(.isDraft) | .tagName' | while read -r name; do
              echo "Publishing draft: $name"
              gh release edit "$name" --repo "$GITHUB_REPOSITORY" --draft=false || true
            done
          echo "--- final state ---"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,url
