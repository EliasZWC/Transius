name: Release

# 触发方式：
#   1. 推送 v* 标签（例如 v0.0.1）→ 构建三平台产物并发布 GitHub Release
#   2. 手动触发（仅构建，产物上传为 workflow artifact，不发布）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 用自研安装器；macOS / Linux 暂时用 electron-builder 的原生产物
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Windows：用自研安装器（Transius-Setup-x.y.z.exe）
      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        run: node scripts/build-installer.mjs

      # macOS / Linux：仍用 electron-builder
      - name: Build dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          npm run build
          npx electron-builder --mac --publish never

      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          npm run build
          npx electron-builder --linux --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: transius-${{ matrix.os }}
          path: |
            release-installer/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: ignore

  # 汇总三平台产物，创建/更新 Release。
  # 注意：自研安装器是 portable 壳，不会自己上传，必须在这里统一 gh release upload。
  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: List artifacts
        run: find dist-artifacts -type f | sort

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # 三个平台可能各自建了 draft，先统一清掉重复的 draft
          gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName,isDraft \
            --jq '.[] | select(.isDraft) | .tagName' | while read -r name; do
              gh release delete "$name" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag=false || true
            done

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Transius ${TAG#v}" \
              --notes "详见 https://github.com/${GITHUB_REPOSITORY}#readme"
          fi

          # 上传所有安装包（Windows 用自研安装器，mac/linux 用原生包）
          find dist-artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) \
            -exec gh release upload "$TAG" {} --repo "$GITHUB_REPOSITORY" --clobber \;

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets
